name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Job 1: build one arch per runner (3 parallel machines) ──────────────────
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runtime: win-x64
          - arch: arm64
            platform: ARM64
            runtime: win-arm64
          - arch: x86
            platform: x86
            runtime: win-x86

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Extract version from tag ────────────────────────────────────────
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"
          $semver = $tag.TrimStart('v')
          $quad   = if ($semver.Split('.').Count -lt 4) { "$semver.0" } else { $semver }
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "quad=$quad"     >> $env:GITHUB_OUTPUT

      # ── Restore signing certificate ─────────────────────────────────────
      - name: Restore signing certificate
        id: cert
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX }}")
          [IO.File]::WriteAllBytes("$PWD\HamGallery.pfx", $pfxBytes)

          $pfxPwd = ConvertTo-SecureString "${{ secrets.SIGNING_CERT_PASSWORD }}" -AsPlainText -Force
          $cert   = Import-PfxCertificate -FilePath HamGallery.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pfxPwd

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # ── Portable self-contained publish ────────────────────────────────
      - name: Publish ${{ matrix.arch }}
        shell: pwsh
        run: |
          dotnet publish FluentGallery\FluentGallery.csproj `
            -p:Platform=${{ matrix.platform }} -c Release `
            --runtime ${{ matrix.runtime }} --self-contained `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }} `
            -o publish\FluentGallery\${{ matrix.arch }}
          Copy-Item "FluentGallery\bin\${{ matrix.platform }}\Release\net10.0-windows10.0.19041.0\${{ matrix.runtime }}\FluentGallery.pri" `
            "publish\FluentGallery\${{ matrix.arch }}\" -Force -ErrorAction SilentlyContinue

      # ── Create portable ZIP ─────────────────────────────────────────────
      - name: Create portable ZIP ${{ matrix.arch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $ver = "${{ steps.ver.outputs.semver }}"
          pwsh -File tools\zip.ps1 `
            -SourceDir "publish\FluentGallery\${{ matrix.arch }}" `
            -DestPath  "dist\HamGallery-$ver-portable-${{ matrix.arch }}.zip"

      # ── Build signed MSIX ───────────────────────────────────────────────
      - name: Build MSIX ${{ matrix.arch }}
        shell: pwsh
        run: |
          dotnet build FluentGallery\FluentGallery.csproj `
            -p:Platform=${{ matrix.platform }} -c Release -p:BuildMsix=true `
            "-p:AppxPackageDir=${{ github.workspace }}\dist\msix\" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            -p:AppxPackageVersion=${{ steps.ver.outputs.quad }} `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }}

      # ── Copy app MSIX to a flat upload directory ────────────────────────
      # (avoids glob recursion issues in upload-artifact and name collisions
      #  with WindowsAppRuntime dependency packages)
      - name: Prepare MSIX for upload ${{ matrix.arch }}
        shell: pwsh
        run: |
          $msix = Get-ChildItem "dist\msix" -Recurse -Include "*.msix" |
            Where-Object { $_.Name -notmatch "bundle|WindowsAppRuntime" } |
            Select-Object -First 1
          if (-not $msix) {
            Write-Host "dist\msix contents:"
            Get-ChildItem "dist\msix" -Recurse | Select-Object -ExpandProperty FullName
            throw "App .msix not found under dist\msix"
          }
          Write-Host "Found: $($msix.FullName)"
          New-Item -ItemType Directory -Path "dist\upload" -Force | Out-Null
          Copy-Item $msix.FullName "dist\upload\FluentGallery_${{ matrix.arch }}.msix" -Force

      # ── Upload artifacts for this arch ──────────────────────────────────
      - name: Upload artifacts ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/upload/*.msix
          retention-days: 1

  # ── Job 2: bundle + publish release (runs after all 3 builders finish) ───────
  release:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Extract version from tag ────────────────────────────────────────
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"
          $semver = $tag.TrimStart('v')
          $quad   = if ($semver.Split('.').Count -lt 4) { "$semver.0" } else { $semver }
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "quad=$quad"     >> $env:GITHUB_OUTPUT

      # ── Restore cert (for signing bundle + exporting .cer) ──────────────
      - name: Restore signing certificate
        id: cert
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX }}")
          [IO.File]::WriteAllBytes("$PWD\HamGallery.pfx", $pfxBytes)

          $pfxPwd = ConvertTo-SecureString "${{ secrets.SIGNING_CERT_PASSWORD }}" -AsPlainText -Force
          $cert   = Import-PfxCertificate -FilePath HamGallery.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pfxPwd

          Export-Certificate -Cert $cert -FilePath HamGallery.cer -Type CERT | Out-Null

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # ── Download all arch artifacts ──────────────────────────────────────
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-all
          merge-multiple: true

      # ── Diagnose downloaded artifacts ────────────────────────────────────
      - name: List downloaded artifacts
        shell: pwsh
        run: |
          Write-Host "=== dist-all/ ==="
          if (Test-Path dist-all) {
            Get-ChildItem dist-all -Recurse | Select-Object -ExpandProperty FullName
          } else {
            Write-Host "(dist-all not found)"
          }

      # ── Bundle all MSIXs into a .msixbundle ─────────────────────────────
      - name: Create msixbundle
        shell: pwsh
        run: |
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdkBin -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem $sdkBin -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) { throw "makeappx.exe not found" }
          if (-not $signtool)  { throw "signtool.exe not found" }

          # App MSIXs are in flat upload/ dir, named FluentGallery_<arch>.msix
          $staging = "dist-all\msix-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Get-ChildItem "dist-all" -Recurse -Filter "FluentGallery_*.msix" |
            Where-Object { $_.Name -notmatch "bundle" } |
            ForEach-Object {
              Copy-Item $_.FullName "$staging\$($_.Name)" -Force
              Write-Host "Staging: $($_.Name)"
            }

          $ver    = "${{ steps.ver.outputs.semver }}"
          $bundle = "dist-all\HamGallery-$ver.msixbundle"

          & $makeappx bundle /d $staging /p $bundle /bv "${{ steps.ver.outputs.quad }}" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          & $signtool sign /fd SHA256 /f HamGallery.pfx /p "${{ secrets.SIGNING_CERT_PASSWORD }}" $bundle
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Write-Host "Bundle: $bundle"

      # ── Publish GitHub Release ───────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ham Gallery ${{ steps.ver.outputs.semver }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 安装说明

            ### MSIX 安装包（推荐）
            1. 下载 `HamGallery.cer`，双击 → **安装到本地计算机 → 受信任人**
            2. 下载 `HamGallery-${{ steps.ver.outputs.semver }}.msixbundle`，双击安装

            > 证书为 CI 构建时自动生成的自签名证书，每次发布均不同。每次升级需重新信任新证书。

            ### 绿色版 ZIP
            解压后直接运行 `FluentGallery.exe`，无需安装。支持 x64 / arm64 / x86 三种架构。
          files: |
            dist-all/HamGallery-*.zip
            dist-all/HamGallery-*.msixbundle
            HamGallery.cer
