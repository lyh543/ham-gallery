name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Job 1: build one arch per runner (3 parallel machines) ──────────────────
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runtime: win-x64
          - arch: arm64
            platform: ARM64
            runtime: win-arm64
          - arch: x86
            platform: x86
            runtime: win-x86

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Extract version from tag ────────────────────────────────────────
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"
          $semver = $tag.TrimStart('v')
          $quad   = if ($semver.Split('.').Count -lt 4) { "$semver.0" } else { $semver }
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "quad=$quad"     >> $env:GITHUB_OUTPUT

      # ── Portable self-contained publish ────────────────────────────────
      - name: Publish ${{ matrix.arch }}
        shell: pwsh
        run: |
          dotnet publish FluentGallery\FluentGallery.csproj `
            -p:Platform=${{ matrix.platform }} -c Release `
            --runtime ${{ matrix.runtime }} --self-contained `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }} `
            -o publish\FluentGallery\${{ matrix.arch }}
          Copy-Item "FluentGallery\bin\${{ matrix.platform }}\Release\net10.0-windows10.0.19041.0\${{ matrix.runtime }}\FluentGallery.pri" `
            "publish\FluentGallery\${{ matrix.arch }}\" -Force -ErrorAction SilentlyContinue

      # ── Create portable ZIP ─────────────────────────────────────────────
      - name: Create portable ZIP ${{ matrix.arch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $ver = "${{ steps.ver.outputs.semver }}"
          pwsh -File tools\zip.ps1 `
            -SourceDir "publish\FluentGallery\${{ matrix.arch }}" `
            -DestPath  "dist\HamGallery-$ver-portable-${{ matrix.arch }}.zip"

      # ── Build unsigned MSIX (signing happens once on the bundle in release job) ──
      - name: Build MSIX ${{ matrix.arch }}
        shell: pwsh
        run: |
          dotnet build FluentGallery\FluentGallery.csproj `
            -p:Platform=${{ matrix.platform }} -c Release -p:BuildMsix=true `
            "-p:AppxPackageDir=${{ github.workspace }}\dist\msix\" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageVersion=${{ steps.ver.outputs.quad }} `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }}

      # ── Copy app MSIX to a flat upload directory ────────────────────────
      # (avoids glob recursion issues in upload-artifact and name collisions
      #  with WindowsAppRuntime dependency packages)
      - name: Prepare MSIX for upload ${{ matrix.arch }}
        shell: pwsh
        run: |
          # With signing disabled, dotnet generates only a bare .msix (no bundle)
          $pkg = Get-ChildItem "dist\msix" -Recurse |
            Where-Object { $_.Extension -eq ".msix" -and $_.Name -notmatch "WindowsAppRuntime" } |
            Select-Object -First 1
          if (-not $pkg) {
            Write-Host "dist\msix contents:"
            Get-ChildItem "dist\msix" -Recurse | Select-Object -ExpandProperty FullName
            throw "App .msix not found under dist\msix"
          }
          Write-Host "Found: $($pkg.FullName)"
          New-Item -ItemType Directory -Path "dist\upload" -Force | Out-Null
          Copy-Item $pkg.FullName "dist\upload\FluentGallery_${{ matrix.arch }}.msix" -Force

      # ── Upload artifacts for this arch ──────────────────────────────────
      - name: Upload artifacts ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/upload/*.msix
          retention-days: 1

  # ── Job 2: bundle + publish release (runs after all 3 builders finish) ───────
  release:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Extract version from tag ────────────────────────────────────────
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"
          $semver = $tag.TrimStart('v')
          $quad   = if ($semver.Split('.').Count -lt 4) { "$semver.0" } else { $semver }
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "quad=$quad"     >> $env:GITHUB_OUTPUT

      # ── Restore cert (for signing bundle + exporting .cer) ──────────────
      - name: Restore signing certificate
        id: cert
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX }}")
          [IO.File]::WriteAllBytes("$PWD\HamGallery.pfx", $pfxBytes)

          $pfxPwd = ConvertTo-SecureString "${{ secrets.SIGNING_CERT_PASSWORD }}" -AsPlainText -Force
          $cert   = Import-PfxCertificate -FilePath HamGallery.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pfxPwd

          Export-Certificate -Cert $cert -FilePath HamGallery.cer -Type CERT | Out-Null

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # ── Download all arch artifacts ──────────────────────────────────────
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-all
          merge-multiple: true

      # ── Diagnose downloaded artifacts ────────────────────────────────────
      - name: List downloaded artifacts
        shell: pwsh
        run: |
          Write-Host "=== dist-all/ ==="
          if (Test-Path dist-all) {
            Get-ChildItem dist-all -Recurse | Select-Object -ExpandProperty FullName
          } else {
            Write-Host "(dist-all not found)"
          }

      # ── Bundle MSIXs ───────────────────────────────────────────────────
      # Generates: per-arch .msixbundle + combined .msixbundle, then signs all
      - name: Create msixbundle
        shell: pwsh
        run: |
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdkBin -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem $sdkBin -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) { throw "makeappx.exe not found" }
          if (-not $signtool)  { throw "signtool.exe not found" }

          $ver  = "${{ steps.ver.outputs.semver }}"
          $quad = "${{ steps.ver.outputs.quad }}"
          $dist = "dist-all"

          # Collect all app MSIXs (named FluentGallery_<arch>.msix)
          $msixFiles = Get-ChildItem "$dist" -Recurse |
            Where-Object { $_.Extension -eq ".msix" -and $_.Name -match "^FluentGallery_" }

          # 1. Per-arch single-package msixbundle
          foreach ($msix in $msixFiles) {
            $arch   = $msix.BaseName -replace '^FluentGallery_', ''
            $single = "$dist\HamGallery-$ver-$arch.msixbundle"
            $stage  = "$dist\stage-$arch"
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            Copy-Item $msix.FullName "$stage\$($msix.Name)" -Force
            Write-Host "Building $arch bundle from: $($msix.Name)"
            & $makeappx bundle /d $stage /p $single /bv $quad /o
            if ($LASTEXITCODE -ne 0) { throw "makeappx failed for $arch" }
          }

          # 2. Combined all-arch msixbundle (signed, for sideload)
          $stagingAll = "$dist\msix-staging-all"
          New-Item -ItemType Directory -Path $stagingAll -Force | Out-Null
          foreach ($msix in $msixFiles) {
            Copy-Item $msix.FullName "$stagingAll\$($msix.Name)" -Force
            Write-Host "Staging for combined bundle: $($msix.Name)"
          }
          $bundleAll = "$dist\HamGallery-$ver.msixbundle"
          & $makeappx bundle /d $stagingAll /p $bundleAll /bv $quad /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed for combined bundle" }

          # 3. Unsigned all-arch msixbundle for Microsoft Store submission
          $bundleStore = "$dist\HamGallery-$ver-store.msixbundle"
          Copy-Item $bundleAll $bundleStore -Force
          Write-Host "Store bundle (unsigned): $bundleStore"

          # 4. Sign the sideload bundles (store bundle stays unsigned)
          Get-ChildItem $dist -Filter "*.msixbundle" |
            Where-Object { $_.Name -notmatch "-store\." } |
            ForEach-Object {
              Write-Host "Signing: $($_.Name)"
              & $signtool sign /fd SHA256 /f HamGallery.pfx /p "${{ secrets.SIGNING_CERT_PASSWORD }}" $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            }

      # ── Publish GitHub Release ───────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ham Gallery ${{ steps.ver.outputs.semver }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 安装说明

            ### MSIX 安装包（推荐）
            1. 下载 `HamGallery.cer`，双击 → **安装到本地计算机 → 受信任人**
            2. 下载对应架构的 `.msixbundle`，双击安装
               - `HamGallery-${{ steps.ver.outputs.semver }}.msixbundle` — 全架构包（x64 + arm64 + x86）
               - `HamGallery-${{ steps.ver.outputs.semver }}-x64.msixbundle` — 仅 x64
               - `HamGallery-${{ steps.ver.outputs.semver }}-arm64.msixbundle` — 仅 arm64
               - `HamGallery-${{ steps.ver.outputs.semver }}-x86.msixbundle` — 仅 x86

            > 证书为 CI 构建时自动生成的自签名证书，每次发布均不同。每次升级需重新信任新证书。

            ### 绿色版 ZIP
            解压后直接运行 `FluentGallery.exe`，无需安装。支持 x64 / arm64 / x86 三种架构。
          files: |
            dist-all/HamGallery-*.zip
            dist-all/HamGallery-*.msixbundle
            HamGallery.cer
