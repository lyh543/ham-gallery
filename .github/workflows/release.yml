name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Extract version from tag ──────────────────────────────────────────
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"   # e.g. v1.2.3
          $semver = $tag.TrimStart('v')         # 1.2.3
          $quad   = "$semver.0"                 # 1.2.3.0  (required by MSIX)
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "quad=$quad"     >> $env:GITHUB_OUTPUT

      # ── Self-signed certificate ───────────────────────────────────────────
      - name: Create self-signed certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=HamGallery" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Ham Gallery" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pfxPwd = ConvertTo-SecureString "ci-build" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath HamGallery.pfx -Password $pfxPwd | Out-Null
          Export-Certificate    -Cert $cert -FilePath HamGallery.cer -Type CERT          | Out-Null

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      # ── Portable self-contained publish ──────────────────────────────────
      - name: Publish x64
        shell: pwsh
        run: |
          dotnet publish FluentGallery\FluentGallery.csproj `
            -p:Platform=x64 -c Release --runtime win-x64 --self-contained `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }} `
            -o publish\FluentGallery\x64
          Copy-Item "FluentGallery\bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\FluentGallery.pri" `
            "publish\FluentGallery\x64\" -Force -ErrorAction SilentlyContinue

      - name: Publish arm64
        shell: pwsh
        run: |
          dotnet publish FluentGallery\FluentGallery.csproj `
            -p:Platform=ARM64 -c Release --runtime win-arm64 --self-contained `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }} `
            -o publish\FluentGallery\arm64
          Copy-Item "FluentGallery\bin\ARM64\Release\net10.0-windows10.0.19041.0\win-arm64\FluentGallery.pri" `
            "publish\FluentGallery\arm64\" -Force -ErrorAction SilentlyContinue

      - name: Publish x86
        shell: pwsh
        run: |
          dotnet publish FluentGallery\FluentGallery.csproj `
            -p:Platform=x86 -c Release --runtime win-x86 --self-contained `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }} `
            -o publish\FluentGallery\x86
          Copy-Item "FluentGallery\bin\x86\Release\net10.0-windows10.0.19041.0\win-x86\FluentGallery.pri" `
            "publish\FluentGallery\x86\" -Force -ErrorAction SilentlyContinue

      # ── Create portable ZIPs ──────────────────────────────────────────────
      - name: Create portable ZIPs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $ver = "${{ steps.ver.outputs.semver }}"
          foreach ($arch in @("x64", "arm64", "x86")) {
            pwsh -File tools\zip.ps1 `
              -SourceDir "publish\FluentGallery\$arch" `
              -DestPath  "dist\HamGallery-$ver-portable-$arch.zip"
          }

      # ── Build signed MSIX per architecture ───────────────────────────────
      - name: Build MSIX x64
        shell: pwsh
        run: |
          dotnet build FluentGallery\FluentGallery.csproj `
            -p:Platform=x64 -c Release -p:BuildMsix=true `
            "-p:AppxPackageDir=${{ github.workspace }}\dist\msix\" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            -p:AppxPackageVersion=${{ steps.ver.outputs.quad }} `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }}

      - name: Build MSIX arm64
        shell: pwsh
        run: |
          dotnet build FluentGallery\FluentGallery.csproj `
            -p:Platform=ARM64 -c Release -p:BuildMsix=true `
            "-p:AppxPackageDir=${{ github.workspace }}\dist\msix\" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            -p:AppxPackageVersion=${{ steps.ver.outputs.quad }} `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }}

      - name: Build MSIX x86
        shell: pwsh
        run: |
          dotnet build FluentGallery\FluentGallery.csproj `
            -p:Platform=x86 -c Release -p:BuildMsix=true `
            "-p:AppxPackageDir=${{ github.workspace }}\dist\msix\" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} `
            -p:AppxPackageVersion=${{ steps.ver.outputs.quad }} `
            -p:InformationalVersion=${{ steps.ver.outputs.semver }}

      # ── Bundle all MSIXs into a .msixbundle ──────────────────────────────
      - name: Create msixbundle
        shell: pwsh
        run: |
          # Locate MakeAppx.exe and SignTool.exe from installed Windows SDK
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $sdkBin -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem $sdkBin -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) { throw "makeappx.exe not found" }
          if (-not $signtool)  { throw "signtool.exe not found" }

          # Collect .msix files from per-arch subdirectories into a staging dir
          $staging = "dist\msix-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Get-ChildItem "dist\msix" -Recurse -Filter "*.msix" | ForEach-Object {
            Copy-Item $_.FullName "$staging\$($_.Name)" -Force
            Write-Host "Staging: $($_.Name)"
          }

          $ver    = "${{ steps.ver.outputs.semver }}"
          $bundle = "dist\HamGallery-$ver.msixbundle"

          # Create bundle
          & $makeappx bundle /d $staging /p $bundle /bv "${{ steps.ver.outputs.quad }}" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          # Sign bundle with the self-signed cert
          & $signtool sign /fd SHA256 /f HamGallery.pfx /p "ci-build" $bundle
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Write-Host "Bundle: $bundle"

      # ── Publish GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ham Gallery ${{ steps.ver.outputs.semver }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 安装说明

            ### MSIX 安装包（推荐）
            1. 下载 `HamGallery.cer`，双击 → **安装到本地计算机 → 受信任人**
            2. 下载 `HamGallery-${{ steps.ver.outputs.semver }}.msixbundle`，双击安装

            > 证书为 CI 构建时自动生成的自签名证书，每次发布均不同。每次升级需重新信任新证书。

            ### 绿色版 ZIP
            解压后直接运行 `FluentGallery.exe`，无需安装。支持 x64 / arm64 / x86 三种架构。
          files: |
            dist/HamGallery-*.zip
            dist/HamGallery-*.msixbundle
            HamGallery.cer
